name: Build APK

# Compile l'APK dans le cloud. Déclenchement : à chaque envoi de code, ou à la main
# (onglet Actions > Build APK > Run workflow). Le fichier APK se télécharge dans
# la section "Artifacts" de l'exécution.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les outils de compilation Android
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Télécharger Godot 4.3 et ses modèles d'export
        run: |
          set -e
          B=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -sSL -o godot.zip "$B/Godot_v4.3-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$B/Godot_v4.3-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          unzip -q templates.tpz -d tpl
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Créer la clé de signature (debug)
        run: |
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Indiquer le SDK Android et Java à Godot
        run: |
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
          } > "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Importer le projet puis exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -e
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --import || true
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/BalulaMoto.apk
          ls -la build/

      - name: Déposer l'APK à télécharger
        uses: actions/upload-artifact@v4
        with:
          name: BalulaMoto-apk
          path: build/BalulaMoto.apk
